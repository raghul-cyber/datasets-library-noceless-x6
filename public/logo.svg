<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" fill="none">
  <!-- Tactical Hex-Chassis Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Hexagon Frame -->
    <polygon points="40,2 78,22 78,66 40,86 2,66 2,22" fill="#091811" stroke="#3b4a41" stroke-width="2"/>
    <polygon points="40,8 72,25 72,61 40,78 8,61 8,25" fill="#040a07" stroke="#143526" stroke-width="1.5"/>
    
    <!-- Sound Wave Cancellation Vectors -->
    <path d="M18 44 C24 32, 28 32, 34 44 C38 52, 42 52, 46 44" stroke="#e5c100" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M46 44 C50 36, 54 36, 58 44 C64 56, 68 56, 74 44" stroke="#00e599" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Central Tactical 'X' Core -->
    <line x1="28" y1="28" x2="52" y2="60" stroke="#00e599" stroke-width="3.5" stroke-linecap="square"/>
    <line x1="52" y1="28" x2="28" y2="60" stroke="#f0fdf4" stroke-width="3" stroke-linecap="square"/>
    
    <!-- Center Dot Sensor Array -->
    <circle cx="40" cy="44" r="3" fill="#00e599"/>
    <circle cx="40" cy="44" r="6" stroke="#4dffb2" stroke-width="0.75" fill="none" opacity="0.8"/>
  </g>
  
  <!-- Logotype Typography -->
  <text x="105" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#f0fdf4" letter-spacing="0.08em">NOISELESS<tspan fill="#00e599">-X</tspan><tspan fill="#4dffb2" font-size="22" font-weight="900">6</tspan></text>
  <text x="106" y="68" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#849589" letter-spacing="0.16em">SMART INDIA HACKATHON 2026 // EMBEDDED ACOUSTIC R&amp;D</text>
  
  <!-- Status Chip Indicator -->
  <g transform="translate(425, 28)">
    <rect x="0" y="0" width="65" height="18" rx="2" fill="#143526" stroke="#3b4a41" stroke-width="1"/>
    <circle cx="9" cy="9" r="3" fill="#00e599"/>
    <text x="18" y="12.5" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#00e599" letter-spacing="0.05em">LIVE R&amp;D</text>
  </g>
</svg>
